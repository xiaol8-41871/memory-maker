<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Maker ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 16px 60px;
  background: #eaf4ff;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  margin: 15px 0 30px;
  color: #729bc5;
  font-size: 28px;
}

.canvas {
  width: 100%;
  max-width: 900px;
  aspect-ratio: 2048 / 1430;
  margin: 0 auto;
  background: #c9e4f8;
  overflow: hidden;
}

.canvas svg {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.frame {
  pointer-events: none;
}

.photo-hit {
  fill: transparent;
  pointer-events: all;
  cursor: grab;
}

.photo-hit:active {
  cursor: grabbing;
}

.photo-hit.selected {
  stroke: #7bb8f5;
  stroke-width: 3;
  stroke-dasharray: 12 8;
}

.controls {
  max-width: 600px;
  margin: 35px auto;
  padding: 28px;
  background: white;
  border-radius: 22px;
}

.controls h2 {
  margin: 0 0 25px;
  color: #729bc5;
  font-size: 21px;
}

.upload {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin: 20px 0;
  color: #555;
  font-size: 14px;
}

.upload input {
  width: 55%;
  min-width: 0;
}

.editor {
  margin-top: 30px;
  padding: 25px 18px;
  background: #f0f7ff;
  border-radius: 16px;
}

.editor h3 {
  margin: 0 0 15px;
  color: #729bc5;
  font-size: 17px;
}

.hint {
  color: #777;
  font-size: 13px;
  line-height: 1.8;
}

.zoom-control {
  display: block;
  margin-top: 20px;
  color: #555;
  font-size: 14px;
}

#zoomSlider {
  width: 90%;
  margin-top: 15px;
  accent-color: #729bc5;
}

#zoomValue {
  color: #729bc5;
  font-size: 14px;
}

button {
  margin-top: 12px;
  padding: 11px 25px;
  background: #93bce4;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #729bc5;
}

@media (max-width: 500px) {
  h1 {
    font-size: 24px;
  }

  .controls {
    padding: 20px;
  }

  .upload {
    flex-direction: column;
    align-items: flex-start;
  }

  .upload input {
    width: 100%;
  }
}
</style>
</head>

<body>

<h1>Memory Maker ♡</h1>

<div class="canvas">

<svg
  id="mainCanvas"
  viewBox="0 0 2048 1430"
  xmlns="http://www.w3.org/2000/svg"
>

<defs>
  <mask id="musicMask" maskUnits="userSpaceOnUse"
    x="0" y="0" width="2048" height="1430">
    <image id="musicMaskImage"
      width="2048" height="1430"/>
  </mask>

  <mask id="dayMask" maskUnits="userSpaceOnUse"
    x="0" y="0" width="2048" height="1430">
    <image id="dayMaskImage"
      width="2048" height="1430"/>
  </mask>

  <mask id="leftMask" maskUnits="userSpaceOnUse"
    x="0" y="0" width="2048" height="1430">
    <image id="leftMaskImage"
      width="2048" height="1430"/>
  </mask>

  <mask id="rightMask" maskUnits="userSpaceOnUse"
    x="0" y="0" width="2048" height="1430">
    <image id="rightMaskImage"
      width="2048" height="1430"/>
  </mask>
</defs>


<!-- 音楽プレイヤー -->

<g mask="url(#musicMask)">
  <image id="musicPhoto" preserveAspectRatio="none"/>
</g>

<image class="frame"
  href="images/musicplayer.PNG"
  width="2048" height="1430"/>


<!-- 記念日カード -->

<g mask="url(#dayMask)">
  <image id="dayPhoto" preserveAspectRatio="none"/>
</g>

<image class="frame"
  href="images/d_day.PNG"
  width="2048" height="1430"/>


<!-- 左チェキ -->

<g mask="url(#leftMask)">
  <g transform="rotate(-7 958 620)">
    <image id="leftPhoto" preserveAspectRatio="none"/>
  </g>
</g>

<image class="frame"
  href="images/polaroid_1.PNG"
  width="2048" height="1430"/>


<!-- 右チェキ -->

<g mask="url(#rightMask)">
  <g transform="rotate(8.08 1344 638)">
    <image id="rightPhoto" preserveAspectRatio="none"/>
  </g>
</g>

<image class="frame"
  href="images/polaroid_2.PNG"
  width="2048" height="1430"/>


<!-- 写真操作エリア -->

<g id="hitAreas">

  <rect class="photo-hit"
    data-id="musicPhoto"
    x="474" y="300"
    width="428" height="413"/>

  <rect class="photo-hit"
    data-id="dayPhoto"
    x="1281" y="325"
    width="215" height="210"/>

  <polygon class="photo-hit"
    data-id="leftPhoto"
    points="958,620 1276,581 1328,1010 1011,1049"/>

  <polygon class="photo-hit"
    data-id="rightPhoto"
    points="1344,638 1661,683 1601,1110 1283,1065"/>

</g>

</svg>
</div>


<div class="controls">

<h2>♡ Customize ♡</h2>

<label class="upload">
  🎵 ジャケット写真
  <input type="file" accept="image/*"
    onchange="setPhoto(event,'musicPhoto')">
</label>

<label class="upload">
  ♡ 記念日カード
  <input type="file" accept="image/*"
    onchange="setPhoto(event,'dayPhoto')">
</label>

<label class="upload">
  📷 チェキ左
  <input type="file" accept="image/*"
    onchange="setPhoto(event,'leftPhoto')">
</label>

<label class="upload">
  📷 チェキ右
  <input type="file" accept="image/*"
    onchange="setPhoto(event,'rightPhoto')">
</label>


<div class="editor">

<h3 id="editingTitle">
  写真を選択してください ♡
</h3>

<p class="hint">
  写真をアップロードすると編集できます。<br>
  ドラッグで位置を調整してください。
</p>

<label class="zoom-control">
  拡大・縮小
  <input
    id="zoomSlider"
    type="range"
    min="0.5"
    max="4"
    step="0.01"
    value="1"
  >
</label>

<p id="zoomValue">100%</p>

<button onclick="resetPhoto()">
  ↩ 位置をリセット
</button>

</div>
</div>


<script>

const SVG_NS = "http://www.w3.org/2000/svg";

const names = {
  musicPhoto: "ジャケット写真",
  dayPhoto: "記念日カード",
  leftPhoto: "チェキ左",
  rightPhoto: "チェキ右"
};

const frames = {
  musicPhoto: {
    x: 474, y: 300,
    w: 428, h: 413,
    angle: 0
  },

  dayPhoto: {
    x: 1281, y: 325,
    w: 215, h: 210,
    angle: 0
  },

  leftPhoto: {
    x: 958, y: 620,
    w: 320.4, h: 432.2,
    angle: -7
  },

  rightPhoto: {
    x: 1344, y: 638,
    w: 320.2, h: 431.2,
    angle: 8.08
  }
};

// マスクを作るための設定
const maskSettings = [
  {
    file: "images/musicplayer.PNG",
    target: "musicMaskImage",
    seedX: 680,
    seedY: 500
  },
  {
    file: "images/d_day.PNG",
    target: "dayMaskImage",
    seedX: 1385,
    seedY: 430
  },
  {
    file: "images/polaroid_1.PNG",
    target: "leftMaskImage",
    seedX: 1140,
    seedY: 800
  },
  {
    file: "images/polaroid_2.PNG",
    target: "rightMaskImage",
    seedX: 1470,
    seedY: 850
  }
];

const photos = {};

let selectedPhoto = null;
let dragging = false;
let lastPoint = null;

const svg = document.getElementById("mainCanvas");
const slider = document.getElementById("zoomSlider");

Object.keys(names).forEach(id => {
  photos[id] = {
    url: null,
    naturalWidth: 0,
    naturalHeight: 0,
    offsetX: 0,
    offsetY: 0,
    zoom: 1
  };
});


// =====================================
// PNGの透明な窓からマスクを自動生成
// =====================================

async function createMask(setting) {

  const source = new Image();
  source.src = setting.file;

  await source.decode();

  const width = 2048;
  const height = 1430;

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(source, 0, 0, width, height);

  const pixels = ctx.getImageData(
    0, 0, width, height
  );

  const data = pixels.data;
  const total = width * height;

  // 透明な場所を記録
  const transparent = new Uint8Array(total);

  for (let i = 0; i < total; i++) {
    const alpha = data[i * 4 + 3];

    if (alpha < 128) {
      transparent[i] = 1;
    }
  }

  // 指定した窓の内側から、
  // つながっている透明部分だけを抽出
  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);

  let head = 0;
  let tail = 0;

  const start =
    setting.seedY * width + setting.seedX;

  if (!transparent[start]) {
    throw new Error(
      "写真窓の位置を確認してください: " + setting.file
    );
  }

  queue[tail++] = start;
  visited[start] = 1;

  while (head < tail) {

    const index = queue[head++];

    const x = index % width;
    const y = Math.floor(index / width);

    const neighbors = [];

    if (x > 0) neighbors.push(index - 1);
    if (x < width - 1) neighbors.push(index + 1);
    if (y > 0) neighbors.push(index - width);
    if (y < height - 1) neighbors.push(index + width);

    for (const next of neighbors) {

      if (visited[next]) continue;
      if (!transparent[next]) continue;

      visited[next] = 1;
      queue[tail++] = next;
    }
  }

  // 背景全体を拾ってしまった場合は停止
  if (tail > total * 0.3) {
    throw new Error(
      "写真窓以外が選択されました: " + setting.file
    );
  }

  // 境界を約2pxだけ広げる
  // 白いフレームの下に写真を潜り込ませるため
  const expanded = new Uint8Array(visited);

  for (let i = 0; i < tail; i++) {

    const index = queue[i];
    const x = index % width;
    const y = Math.floor(index / width);

    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {

        const nx = x + dx;
        const ny = y + dy;

        if (
          nx < 0 || nx >= width ||
          ny < 0 || ny >= height
        ) continue;

        expanded[ny * width + nx] = 1;
      }
    }
  }

  // 白＝写真を表示、黒＝写真を非表示
  const maskData = ctx.createImageData(
    width, height
  );

  for (let i = 0; i < total; i++) {

    const p = i * 4;

    if (expanded[i]) {
      maskData.data[p] = 255;
      maskData.data[p + 1] = 255;
      maskData.data[p + 2] = 255;
      maskData.data[p + 3] = 255;
    } else {
      maskData.data[p] = 0;
      maskData.data[p + 1] = 0;
      maskData.data[p + 2] = 0;
      maskData.data[p + 3] = 255;
    }
  }

  ctx.putImageData(maskData, 0, 0);

  const url = canvas.toDataURL("image/png");

  document.getElementById(setting.target)
    .setAttribute("href", url);
}


// 起動時に4枚のマスクを準備
async function initializeMasks() {

  for (const setting of maskSettings) {
    try {
      await createMask(setting);
    } catch (error) {
      console.error(error);
    }
  }
}

initializeMasks();


// =====================================
// 写真アップロード
// =====================================

function setPhoto(event, id) {

  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const tempImage = new Image();

  tempImage.onload = function() {

    const photo = photos[id];

    if (photo.url) {
      URL.revokeObjectURL(photo.url);
    }

    photo.url = url;
    photo.naturalWidth = tempImage.naturalWidth;
    photo.naturalHeight = tempImage.naturalHeight;

    photo.offsetX = 0;
    photo.offsetY = 0;
    photo.zoom = 1;

    document.getElementById(id)
      .setAttribute("href", url);

    updatePhoto(id);
    selectPhoto(id);
  };

  tempImage.onerror = function() {
    URL.revokeObjectURL(url);
    alert("画像を読み込めませんでした。");
  };

  tempImage.src = url;
}


// =====================================
// 写真の位置・サイズ更新
// =====================================

function updatePhoto(id) {

  const photo = photos[id];
  if (!photo.url) return;

  const frame = frames[id];
  const image = document.getElementById(id);

  const baseScale = Math.max(
    (frame.w + 8) / photo.naturalWidth,
    (frame.h + 8) / photo.naturalHeight
  );

  const scale = baseScale * photo.zoom;

  const width = photo.naturalWidth * scale;
  const height = photo.naturalHeight * scale;

  const x =
    frame.x +
    (frame.w - width) / 2 +
    photo.offsetX;

  const y =
    frame.y +
    (frame.h - height) / 2 +
    photo.offsetY;

  image.setAttribute("x", x);
  image.setAttribute("y", y);
  image.setAttribute("width", width);
  image.setAttribute("height", height);
}


// =====================================
// 編集対象の選択
// =====================================

function selectPhoto(id) {

  selectedPhoto = id;

  document.querySelectorAll(".photo-hit")
    .forEach(area => {
      area.classList.toggle(
        "selected",
        area.dataset.id === id
      );
    });

  document.getElementById("editingTitle")
    .textContent = "編集中：" + names[id];

  slider.value = photos[id].zoom;
  updateZoomLabel();
}


// 拡大率表示
function updateZoomLabel() {

  document.getElementById("zoomValue")
    .textContent =
    Math.round(Number(slider.value) * 100) + "%";
}


// 拡大・縮小
slider.addEventListener("input", function() {

  if (!selectedPhoto) return;

  photos[selectedPhoto].zoom =
    Number(slider.value);

  updatePhoto(selectedPhoto);
  updateZoomLabel();
});


// リセット
function resetPhoto() {

  if (!selectedPhoto) return;

  const photo = photos[selectedPhoto];

  photo.offsetX = 0;
  photo.offsetY = 0;
  photo.zoom = 1;

  slider.value = 1;

  updatePhoto(selectedPhoto);
  updateZoomLabel();
}


// =====================================
// ドラッグ操作
// =====================================

function getPoint(event) {

  const point = svg.createSVGPoint();

  point.x = event.clientX;
  point.y = event.clientY;

  const matrix = svg.getScreenCTM();
  if (!matrix) return null;

  return point.matrixTransform(
    matrix.inverse()
  );
}

svg.addEventListener("pointerdown", function(event) {

  const target = event.target.closest(".photo-hit");
  if (!target) return;

  const id = target.dataset.id;
  if (!photos[id].url) return;

  selectPhoto(id);

  dragging = true;
  lastPoint = getPoint(event);

  svg.setPointerCapture(event.pointerId);
  event.preventDefault();
});

svg.addEventListener("pointermove", function(event) {

  if (!dragging || !selectedPhoto || !lastPoint) return;

  const point = getPoint(event);
  if (!point) return;

  const photo = photos[selectedPhoto];
  const frame = frames[selectedPhoto];

  const dx = point.x - lastPoint.x;
  const dy = point.y - lastPoint.y;

  const radians = -frame.angle * Math.PI / 180;

  photo.offsetX +=
    dx * Math.cos(radians) -
    dy * Math.sin(radians);

  photo.offsetY +=
    dx * Math.sin(radians) +
    dy * Math.cos(radians);

  lastPoint = point;

  updatePhoto(selectedPhoto);
});

function stopDragging() {
  dragging = false;
  lastPoint = null;
}

svg.addEventListener("pointerup", stopDragging);
svg.addEventListener("pointercancel", stopDragging);
svg.addEventListener("lostpointercapture", stopDragging);

</script>

</body>
</html>
