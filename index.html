<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Maker ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 16px 60px;
  background: #eaf4ff;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  margin: 15px 0 30px;
  color: #729bc5;
  font-size: 28px;
}

.canvas {
  width: 100%;
  max-width: 900px;
  aspect-ratio: 2048 / 1430;
  margin: 0 auto;
  background: #c9e4f8;
  overflow: hidden;
}

.canvas svg {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.frame {
  pointer-events: none;
}

.photo-hit {
  fill: transparent;
  pointer-events: all;
  cursor: grab;
}

.photo-hit:active {
  cursor: grabbing;
}

.photo-hit.selected {
  stroke: #7bb8f5;
  stroke-width: 3;
  stroke-dasharray: 12 8;
}

.controls {
  max-width: 600px;
  margin: 35px auto;
  padding: 28px;
  background: white;
  border-radius: 22px;
}

.controls h2 {
  margin: 0 0 25px;
  color: #729bc5;
  font-size: 21px;
}

.upload {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin: 20px 0;
  color: #555;
  font-size: 14px;
}

.upload input {
  width: 55%;
  min-width: 0;
}

.editor {
  margin-top: 30px;
  padding: 25px 18px;
  background: #f0f7ff;
  border-radius: 16px;
}

.editor h3 {
  margin: 0 0 15px;
  color: #729bc5;
  font-size: 17px;
}

.hint {
  color: #777;
  font-size: 13px;
  line-height: 1.8;
}

.zoom-control {
  display: block;
  margin-top: 20px;
  color: #555;
  font-size: 14px;
}

#zoomSlider {
  width: 90%;
  margin-top: 15px;
  accent-color: #729bc5;
}

#zoomValue {
  color: #729bc5;
  font-size: 14px;
}

button {
  margin-top: 12px;
  padding: 11px 25px;
  background: #93bce4;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #729bc5;
}

@media (max-width: 500px) {
  h1 {
    font-size: 24px;
  }

  .controls {
    padding: 20px;
  }

  .upload {
    flex-direction: column;
    align-items: flex-start;
  }

  .upload input {
    width: 100%;
  }
}
</style>
</head>

<body>

<h1>Memory Maker ♡</h1>

<div class="canvas">

<svg
  id="mainCanvas"
  viewBox="0 0 2048 1430"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
>

<defs>

  <!-- 音楽プレイヤー：透明窓に合わせた範囲 -->
  <clipPath id="musicClip">
    <rect
      x="473"
      y="299"
      width="430"
      height="415"
    />
  </clipPath>

  <!-- 記念日カード：透明窓に合わせた範囲 -->
  <clipPath id="dayClip">
    <rect
      x="1280"
      y="324"
      width="217"
      height="212"
    />
  </clipPath>

  <!-- 左チェキ -->
  <clipPath id="leftClip">
    <polygon
      points="
        957,619
        1277,580
        1329,1011
        1010,1050
      "
    />
  </clipPath>

  <!-- 右チェキ -->
  <clipPath id="rightClip">
    <polygon
      points="
        1343,637
        1662,682
        1602,1111
        1282,1066
      "
    />
  </clipPath>

</defs>


<!-- 音楽プレイヤー -->

<g clip-path="url(#musicClip)">
  <image
    id="musicPhoto"
    preserveAspectRatio="none"
  />
</g>

<image
  class="frame"
  href="images/musicplayer.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- 記念日カード -->

<g clip-path="url(#dayClip)">
  <image
    id="dayPhoto"
    preserveAspectRatio="none"
  />
</g>

<image
  class="frame"
  href="images/d_day.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- 左チェキ -->

<g clip-path="url(#leftClip)">
  <g transform="rotate(-7 958 620)">
    <image
      id="leftPhoto"
      preserveAspectRatio="none"
    />
  </g>
</g>

<image
  class="frame"
  href="images/polaroid_1.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- 右チェキ -->

<g clip-path="url(#rightClip)">
  <g transform="rotate(8.08 1344 638)">
    <image
      id="rightPhoto"
      preserveAspectRatio="none"
    />
  </g>
</g>

<image
  class="frame"
  href="images/polaroid_2.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- 写真操作エリア -->

<g id="hitAreas">

  <rect
    class="photo-hit"
    data-id="musicPhoto"
    x="474"
    y="300"
    width="428"
    height="413"
  />

  <rect
    class="photo-hit"
    data-id="dayPhoto"
    x="1281"
    y="325"
    width="215"
    height="210"
  />

  <polygon
    class="photo-hit"
    data-id="leftPhoto"
    points="
      958,620
      1276,581
      1328,1010
      1011,1049
    "
  />

  <polygon
    class="photo-hit"
    data-id="rightPhoto"
    points="
      1344,638
      1661,683
      1601,1110
      1283,1065
    "
  />

</g>

</svg>

</div>


<div class="controls">

<h2>♡ Customize ♡</h2>

<label class="upload">
  🎵 ジャケット写真
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'musicPhoto')"
  >
</label>

<label class="upload">
  ♡ 記念日カード
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'dayPhoto')"
  >
</label>

<label class="upload">
  📷 チェキ左
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'leftPhoto')"
  >
</label>

<label class="upload">
  📷 チェキ右
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'rightPhoto')"
  >
</label>


<div class="editor">

<h3 id="editingTitle">
  写真を選択してください ♡
</h3>

<p class="hint">
  写真をアップロードすると編集できます。<br>
  ドラッグで位置を調整してください。
</p>

<label class="zoom-control">
  拡大・縮小
  <input
    id="zoomSlider"
    type="range"
    min="0.5"
    max="4"
    step="0.01"
    value="1"
  >
</label>

<p id="zoomValue">100%</p>

<button onclick="resetPhoto()">
  ↩ 位置をリセット
</button>

</div>

</div>


<script>

const names = {
  musicPhoto: "ジャケット写真",
  dayPhoto: "記念日カード",
  leftPhoto: "チェキ左",
  rightPhoto: "チェキ右"
};


// 実際の透明窓に合わせた座標
const frames = {

  musicPhoto: {
    x: 474,
    y: 300,
    w: 428,
    h: 413,
    angle: 0
  },

  dayPhoto: {
    x: 1281,
    y: 325,
    w: 215,
    h: 210,
    angle: 0
  },

  leftPhoto: {
    x: 958,
    y: 620,
    w: 320.4,
    h: 432.2,
    angle: -7
  },

  rightPhoto: {
    x: 1344,
    y: 638,
    w: 320.2,
    h: 431.2,
    angle: 8.08
  }

};

const photos = {};

let selectedPhoto = null;
let dragging = false;
let lastPoint = null;

const svg = document.getElementById("mainCanvas");
const slider = document.getElementById("zoomSlider");

Object.keys(names).forEach(id => {
  photos[id] = {
    url: null,
    naturalWidth: 0,
    naturalHeight: 0,
    offsetX: 0,
    offsetY: 0,
    zoom: 1
  };
});


// 写真アップロード
function setPhoto(event, id) {

  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const tempImage = new Image();

  tempImage.onload = function() {

    const photo = photos[id];

    if (photo.url) {
      URL.revokeObjectURL(photo.url);
    }

    photo.url = url;
    photo.naturalWidth = tempImage.naturalWidth;
    photo.naturalHeight = tempImage.naturalHeight;

    photo.offsetX = 0;
    photo.offsetY = 0;
    photo.zoom = 1;

    document.getElementById(id)
      .setAttribute("href", url);

    updatePhoto(id);
    selectPhoto(id);

  };

  tempImage.onerror = function() {
    URL.revokeObjectURL(url);
    alert("画像を読み込めませんでした。");
  };

  tempImage.src = url;

}


// 写真の位置とサイズを更新
function updatePhoto(id) {

  const photo = photos[id];
  if (!photo.url) return;

  const frame = frames[id];
  const image = document.getElementById(id);

  // 縦横比を維持して配置
  // 初期状態で窓より少し大きくする
  const baseScale = Math.max(
    (frame.w + 6) / photo.naturalWidth,
    (frame.h + 6) / photo.naturalHeight
  );

  const scale = baseScale * photo.zoom;

  const width = photo.naturalWidth * scale;
  const height = photo.naturalHeight * scale;

  const x =
    frame.x +
    (frame.w - width) / 2 +
    photo.offsetX;

  const y =
    frame.y +
    (frame.h - height) / 2 +
    photo.offsetY;

  image.setAttribute("x", x);
  image.setAttribute("y", y);
  image.setAttribute("width", width);
  image.setAttribute("height", height);

}


// 編集対象の選択
function selectPhoto(id) {

  selectedPhoto = id;

  document.querySelectorAll(".photo-hit")
    .forEach(area => {
      area.classList.toggle(
        "selected",
        area.dataset.id === id
      );
    });

  document.getElementById("editingTitle")
    .textContent = "編集中：" + names[id];

  slider.value = photos[id].zoom;

  updateZoomLabel();

}


// 拡大率表示
function updateZoomLabel() {

  document.getElementById("zoomValue")
    .textContent =
    Math.round(Number(slider.value) * 100) + "%";

}


// 拡大・縮小
slider.addEventListener("input", function() {

  if (!selectedPhoto) return;

  photos[selectedPhoto].zoom =
    Number(slider.value);

  updatePhoto(selectedPhoto);
  updateZoomLabel();

});


// リセット
function resetPhoto() {

  if (!selectedPhoto) return;

  const photo = photos[selectedPhoto];

  photo.offsetX = 0;
  photo.offsetY = 0;
  photo.zoom = 1;

  slider.value = 1;

  updatePhoto(selectedPhoto);
  updateZoomLabel();

}


// SVG座標への変換
function getPoint(event) {

  const point = svg.createSVGPoint();

  point.x = event.clientX;
  point.y = event.clientY;

  const matrix = svg.getScreenCTM();
  if (!matrix) return null;

  return point.matrixTransform(
    matrix.inverse()
  );

}


// ドラッグ開始
svg.addEventListener("pointerdown", function(event) {

  const target = event.target.closest(".photo-hit");
  if (!target) return;

  const id = target.dataset.id;
  if (!photos[id].url) return;

  selectPhoto(id);

  dragging = true;
  lastPoint = getPoint(event);

  svg.setPointerCapture(event.pointerId);
  event.preventDefault();

});


// ドラッグ中
svg.addEventListener("pointermove", function(event) {

  if (!dragging || !selectedPhoto || !lastPoint) return;

  const point = getPoint(event);
  if (!point) return;

  const photo = photos[selectedPhoto];
  const frame = frames[selectedPhoto];

  const dx = point.x - lastPoint.x;
  const dy = point.y - lastPoint.y;

  const radians = -frame.angle * Math.PI / 180;

  photo.offsetX +=
    dx * Math.cos(radians) -
    dy * Math.sin(radians);

  photo.offsetY +=
    dx * Math.sin(radians) +
    dy * Math.cos(radians);

  lastPoint = point;

  updatePhoto(selectedPhoto);

});


// ドラッグ終了
function stopDragging() {
  dragging = false;
  lastPoint = null;
}

svg.addEventListener("pointerup", stopDragging);
svg.addEventListener("pointercancel", stopDragging);
svg.addEventListener("lostpointercapture", stopDragging);

</script>

</body>
</html>
