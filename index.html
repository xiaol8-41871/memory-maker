<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Maker ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px 60px;
  min-height: 100vh;
  background: #eaf4ff;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  color: #729bc5;
  font-size: 26px;
  margin-bottom: 25px;
}

.canvas {
  position: relative;
  width: 100%;
  max-width: 900px;
  aspect-ratio: 2048 / 1430;
  margin: 0 auto;
  background: #c9e4f8;
  overflow: hidden;
}

.canvas svg {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.frame-image {
  pointer-events: none;
}

.photo-area {
  fill: transparent;
  cursor: grab;
  pointer-events: all;
}

.photo-area:active {
  cursor: grabbing;
}

.photo-area.selected {
  stroke: #83baff;
  stroke-width: 4;
  stroke-dasharray: 12 8;
}

.controls {
  width: 100%;
  max-width: 600px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 20px;
}

.controls h2 {
  color: #729bc5;
  font-size: 20px;
  margin-top: 0;
}

.upload {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 0;
  color: #555;
  font-size: 14px;
}

.upload input {
  width: 55%;
  min-width: 0;
}

.editor {
  margin-top: 28px;
  padding: 22px;
  background: #f0f7ff;
  border-radius: 16px;
}

.editor h3 {
  margin-top: 0;
  color: #729bc5;
  font-size: 17px;
}

.editor input[type="range"] {
  width: 90%;
  accent-color: #729bc5;
}

.hint {
  font-size: 13px;
  color: #777;
  line-height: 1.8;
}

button {
  padding: 11px 24px;
  margin-top: 10px;
  background: #93bce4;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #729bc5;
}

@media (max-width: 500px) {
  h1 {
    font-size: 23px;
  }

  .upload {
    flex-direction: column;
    align-items: flex-start;
  }

  .upload input {
    width: 100%;
  }

  .controls {
    padding: 20px;
  }
}
</style>
</head>

<body>

<h1>Memory Maker ♡</h1>

<div class="canvas">

<svg
  id="mainCanvas"
  viewBox="0 0 2048 1430"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
>

<defs>

  <!-- 音楽プレイヤー -->
  <clipPath id="musicClip">
    <rect
      x="472"
      y="358"
      width="430"
      height="356"
    />
  </clipPath>

  <!-- 記念日カード -->
  <clipPath id="dayClip">
    <rect
      x="1280"
      y="325"
      width="218"
      height="210"
    />
  </clipPath>

  <!-- チェキ左 -->
  <clipPath id="leftClip">
    <polygon
      points="
        958,627
        1275,584
        1328,1011
        1010,1050
      "
    />
  </clipPath>

  <!-- チェキ右 -->
  <clipPath id="rightClip">
    <polygon
      points="
        1345,639
        1661,684
        1600,1107
        1283,1067
      "
    />
  </clipPath>

</defs>


<!-- ===================== -->
<!-- 音楽プレイヤー -->
<!-- ===================== -->

<g clip-path="url(#musicClip)">
  <image
    id="musicPhoto"
    preserveAspectRatio="none"
  />
</g>

<image
  class="frame-image"
  href="images/musicplayer.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- ===================== -->
<!-- 記念日カード -->
<!-- ===================== -->

<g clip-path="url(#dayClip)">
  <image
    id="dayPhoto"
    preserveAspectRatio="none"
  />
</g>

<image
  class="frame-image"
  href="images/d_day.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- ===================== -->
<!-- チェキ左 -->
<!-- ===================== -->

<g clip-path="url(#leftClip)">
  <image
    id="leftPhoto"
    preserveAspectRatio="none"
  />
</g>

<image
  class="frame-image"
  href="images/polaroid_1.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- ===================== -->
<!-- チェキ右 -->
<!-- ===================== -->

<g clip-path="url(#rightClip)">
  <image
    id="rightPhoto"
    preserveAspectRatio="none"
  />
</g>

<image
  class="frame-image"
  href="images/polaroid_2.PNG"
  x="0"
  y="0"
  width="2048"
  height="1430"
/>


<!-- ===================== -->
<!-- 編集用の透明エリア -->
<!-- ===================== -->

<g id="hitAreas">

  <rect
    class="photo-area"
    data-id="musicPhoto"
    x="472"
    y="358"
    width="430"
    height="356"
  />

  <rect
    class="photo-area"
    data-id="dayPhoto"
    x="1280"
    y="325"
    width="218"
    height="210"
  />

  <polygon
    class="photo-area"
    data-id="leftPhoto"
    points="
      958,627
      1275,584
      1328,1011
      1010,1050
    "
  />

  <polygon
    class="photo-area"
    data-id="rightPhoto"
    points="
      1345,639
      1661,684
      1600,1107
      1283,1067
    "
  />

</g>

</svg>

</div>


<!-- ===================== -->
<!-- カスタマイズメニュー -->
<!-- ===================== -->

<div class="controls">

<h2>♡ Customize ♡</h2>

<label class="upload">
  🎵 ジャケット写真
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'musicPhoto')"
  >
</label>

<label class="upload">
  ♡ 記念日カード
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'dayPhoto')"
  >
</label>

<label class="upload">
  📷 チェキ左
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'leftPhoto')"
  >
</label>

<label class="upload">
  📷 チェキ右
  <input
    type="file"
    accept="image/*"
    onchange="setPhoto(event, 'rightPhoto')"
  >
</label>


<div class="editor">

<h3 id="editingTitle">
  写真を選択してください ♡
</h3>

<p class="hint">
  写真をアップロードすると編集できます。<br>
  写真をドラッグして位置を調整してください。
</p>

<label>
  拡大・縮小
  <br><br>

  <input
    id="zoomSlider"
    type="range"
    min="1"
    max="4"
    step="0.01"
    value="1"
  >
</label>

<p id="zoomValue">100%</p>

<button onclick="resetPhoto()">
  ↩ 位置をリセット
</button>

</div>

</div>


<script>

// =====================
// 写真の名前
// =====================

const names = {
  musicPhoto: "ジャケット写真",
  dayPhoto: "記念日カード",
  leftPhoto: "チェキ左",
  rightPhoto: "チェキ右"
};


// =====================
// 写真枠の位置
// =====================

const frames = {
  musicPhoto: {
    x: 472,
    y: 358,
    w: 430,
    h: 356
  },

  dayPhoto: {
    x: 1280,
    y: 325,
    w: 218,
    h: 210
  },

  leftPhoto: {
    x: 958,
    y: 584,
    w: 370,
    h: 466
  },

  rightPhoto: {
    x: 1283,
    y: 639,
    w: 378,
    h: 468
  }
};


// =====================
// 初期設定
// =====================

const photos = {};

let selectedPhoto = null;
let dragging = false;
let lastPoint = null;

const svg = document.getElementById("mainCanvas");
const slider = document.getElementById("zoomSlider");

Object.keys(names).forEach(id => {

  photos[id] = {
    url: null,
    naturalWidth: 0,
    naturalHeight: 0,
    x: 0,
    y: 0,
    zoom: 1
  };

});


// =====================
// 写真アップロード
// =====================

function setPhoto(event, id) {

  const file = event.target.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);

  const tempImage = new Image();

  tempImage.onload = function() {

    const photo = photos[id];

    if (photo.url) {
      URL.revokeObjectURL(photo.url);
    }

    photo.url = url;

    photo.naturalWidth = tempImage.naturalWidth;
    photo.naturalHeight = tempImage.naturalHeight;

    photo.x = 0;
    photo.y = 0;
    photo.zoom = 1;

    const image = document.getElementById(id);

    image.setAttribute("href", url);

    updatePhoto(id);
    selectPhoto(id);

  };

  tempImage.onerror = function() {
    URL.revokeObjectURL(url);
    alert("画像を読み込めませんでした。");
  };

  tempImage.src = url;

}


// =====================
// 数値の範囲制限
// =====================

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}


// =====================
// 写真の表示処理
// =====================

function updatePhoto(id) {

  const photo = photos[id];

  if (!photo.url) return;

  const frame = frames[id];
  const image = document.getElementById(id);

  // 写真の比率を維持して枠を埋める
  const baseScale = Math.max(
    frame.w / photo.naturalWidth,
    frame.h / photo.naturalHeight
  );

  const scale = baseScale * photo.zoom;

  const width = photo.naturalWidth * scale;
  const height = photo.naturalHeight * scale;

  // 枠から写真が外れない範囲を計算
  const maxX = Math.max(
    0,
    (width - frame.w) / 2
  );

  const maxY = Math.max(
    0,
    (height - frame.h) / 2
  );

  photo.x = clamp(photo.x, -maxX, maxX);
  photo.y = clamp(photo.y, -maxY, maxY);

  // 写真を中央に配置
  const x =
    frame.x +
    (frame.w - width) / 2 +
    photo.x;

  const y =
    frame.y +
    (frame.h - height) / 2 +
    photo.y;

  image.setAttribute("x", x);
  image.setAttribute("y", y);

  image.setAttribute("width", width);
  image.setAttribute("height", height);

}


// =====================
// 編集する写真を選択
// =====================

function selectPhoto(id) {

  selectedPhoto = id;

  document.querySelectorAll(".photo-area")
    .forEach(area => {

      area.classList.toggle(
        "selected",
        area.dataset.id === id
      );

    });

  document.getElementById("editingTitle")
    .textContent = "編集中：" + names[id];

  slider.value = photos[id].zoom;

  updateZoomLabel();

}


// =====================
// 拡大率の表示
// =====================

function updateZoomLabel() {

  document.getElementById("zoomValue")
    .textContent =
    Math.round(Number(slider.value) * 100) + "%";

}


// =====================
// 拡大・縮小
// =====================

slider.addEventListener("input", function() {

  if (!selectedPhoto) return;

  photos[selectedPhoto].zoom =
    Number(slider.value);

  updatePhoto(selectedPhoto);
  updateZoomLabel();

});


// =====================
// リセット
// =====================

function resetPhoto() {

  if (!selectedPhoto) return;

  const photo = photos[selectedPhoto];

  photo.x = 0;
  photo.y = 0;
  photo.zoom = 1;

  slider.value = 1;

  updatePhoto(selectedPhoto);
  updateZoomLabel();

}


// =====================
// マウス位置をSVG座標に変換
// =====================

function getPoint(event) {

  const point = svg.createSVGPoint();

  point.x = event.clientX;
  point.y = event.clientY;

  const matrix = svg.getScreenCTM();

  if (!matrix) return null;

  return point.matrixTransform(
    matrix.inverse()
  );

}


// =====================
// ドラッグ開始
// =====================

svg.addEventListener("pointerdown", function(event) {

  const target = event.target.closest(".photo-area");

  if (!target) return;

  const id = target.dataset.id;

  if (!photos[id].url) return;

  selectPhoto(id);

  dragging = true;
  lastPoint = getPoint(event);

  svg.setPointerCapture(event.pointerId);

  event.preventDefault();

});


// =====================
// ドラッグ中
// =====================

svg.addEventListener("pointermove", function(event) {

  if (!dragging) return;
  if (!selectedPhoto) return;
  if (!lastPoint) return;

  const point = getPoint(event);

  if (!point) return;

  const photo = photos[selectedPhoto];

  photo.x += point.x - lastPoint.x;
  photo.y += point.y - lastPoint.y;

  lastPoint = point;

  updatePhoto(selectedPhoto);

});


// =====================
// ドラッグ終了
// =====================

function stopDragging() {

  dragging = false;
  lastPoint = null;

}

svg.addEventListener("pointerup", stopDragging);

svg.addEventListener("pointercancel", stopDragging);

svg.addEventListener(
  "lostpointercapture",
  stopDragging
);

</script>

</body>
</html>
