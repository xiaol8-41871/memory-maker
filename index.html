<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Maker ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 28px 60px;
  background: #eaf4ff;
  font-family: Arial, sans-serif;
  color: #52657a;
}

h1 {
  margin: 0 0 30px;
  color: #729bc5;
  text-align: center;
  font-size: 30px;
  font-weight: 600;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr);
  align-items: start;
  gap: 28px;
  max-width: 1600px;
  margin: 0 auto;
}

.preview-panel {
  min-width: 0;
  position: sticky;
  top: 24px;
}

.preview-label {
  margin: 0 0 12px;
  color: #729bc5;
  font-size: 13px;
  letter-spacing: 2px;
  text-align: center;
}

.canvas {
  width: 100%;
  aspect-ratio: 2048 / 1430;
  background: #c9e4f8;
  border-radius: 16px;
  overflow: hidden;
}

.canvas svg {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.frame {
  pointer-events: none;
}

.photo-hit {
  fill: transparent;
  pointer-events: all;
  cursor: grab;
}

.photo-hit:active {
  cursor: grabbing;
}

.photo-hit.selected {
  stroke: #7bb8f5;
  stroke-width: 3;
  stroke-dasharray: 12 8;
}

.controls {
  min-width: 0;
  padding: 26px;
  background: #fff;
  border-radius: 22px;
}

.controls h2 {
  margin: 0 0 26px;
  color: #729bc5;
  font-size: 23px;
  font-weight: 600;
  text-align: center;
}

.section-title {
  margin: 0 0 15px;
  color: #729bc5;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

.upload-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.upload-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 120px;
  padding: 16px 10px;
  border: 1px solid #dceaf8;
  border-radius: 15px;
  background: #f8fbff;
  cursor: pointer;
  transition: 0.2s;
  text-align: center;
}

.upload-card:hover {
  background: #edf6ff;
  border-color: #a9cbea;
}

.upload-card .icon {
  font-size: 20px;
  margin-bottom: 8px;
}

.upload-card .name {
  color: #729bc5;
  font-size: 12px;
  font-weight: bold;
}

.upload-card .status {
  margin-top: 9px;
  color: #91a8bc;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.upload-card input {
  display: none;
}

.upload-card.loaded {
  background: #eef7ff;
  border-color: #a9cbea;
}

.upload-card.loaded .status {
  color: #729bc5;
}

.editor {
  margin-top: 25px;
  padding: 22px 18px;
  background: #f0f7ff;
  border-radius: 16px;
  text-align: center;
}

.editor h3 {
  margin: 0 0 14px;
  color: #729bc5;
  font-size: 16px;
}

.hint {
  margin: 0 0 18px;
  color: #8191a1;
  font-size: 12px;
  line-height: 1.8;
}

.zoom-control {
  display: block;
  color: #52657a;
  font-size: 13px;
}

#zoomSlider {
  display: block;
  width: 100%;
  margin: 16px 0;
  accent-color: #729bc5;
}

#zoomValue {
  margin: 0 0 12px;
  color: #729bc5;
  font-size: 14px;
}

.reset-button {
  padding: 11px 20px;
  border: 0;
  border-radius: 10px;
  background: #93bce4;
  color: white;
  font-size: 12px;
  cursor: pointer;
}

.reset-button:hover {
  background: #729bc5;
}

.reset-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

@media (max-width: 900px) {
  body {
    padding: 25px 16px 50px;
  }

  h1 {
    font-size: 25px;
  }

  .layout {
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .preview-panel {
    position: static;
    width: 100%;
  }

  .controls {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
  }
}

@media (max-width: 450px) {
  .controls {
    padding: 20px 15px;
  }

  .upload-grid {
    gap: 9px;
  }

  .upload-card {
    min-height: 105px;
    padding: 12px 8px;
  }

  .upload-card .name {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<h1>Memory Maker ♡</h1>

<main class="layout">

  <!-- PREVIEW -->

          <polygon

          <polygon

            "

      </svg>

    </div>

  </section>


  <!-- CUSTOMIZE MENU -->

  <section class="controls">

    <h2>♡ Customize ♡</h2>

    <p class="section-title">01 / PHOTOS</p>

    <div class="upload-grid">

      <label class="upload-card" id="card-musicPhoto">
        <span class="icon">♫</span>

        <input
          type="file"

      <label class="upload-card" id="card-dayPhoto">
        <span class="icon">♡</span>
        <span class="name">D-Day</span>
        <span class="status">+ Upload Photo</span>

        <input
          type="file"
          accept="image/*"

        >
      </label>

      <label class="upload-card" id="card-leftPhoto">
        <span class="icon">▧</span>
        <span class="name">Polaroid 01</span>

      <label class="zoom-control" for="zoomSlider">
        Zoom

<script>

// ======================================
// BASIC SETTINGS
// ======================================

const names = {
  musicPhoto: "Music Player",
  dayPhoto: "D-Day",
  leftPhoto: "Polaroid 01",
  rightPhoto: "Polaroid 02"
};

const frames = {

  musicPhoto: {
    x: 474,
    y: 300,
    w: 428,
    h: 413,
    angle: 0
  },

  dayPhoto: {
    x: 1281,
    y: 325,
    w: 215,
    h: 210,
    angle: 0
  },

  leftPhoto: {
    x: 958,
    y: 620,
    w: 320.4,
    h: 432.2,
    angle: -7
  },

  rightPhoto: {
    x: 1344,
    y: 638,
    w: 320.2,
    h: 431.2,
    angle: 8.08
  }

};

const maskSettings = [

  {
    file: "images/musicplayer.PNG",
    target: "musicMaskImage",
    seedX: 680,
    seedY: 500
  },

  {
    file: "images/d_day.PNG",
    target: "dayMaskImage",
    seedX: 1385,
    seedY: 430
  },

  {
    file: "images/polaroid_1.PNG",
    target: "leftMaskImage",
    seedX: 1140,
    seedY: 800
  },

  {
    file: "images/polaroid_2.PNG",
    target: "rightMaskImage",
    seedX: 1470,
    seedY: 850
  }

];

const photos = {};

let selectedPhoto = null;
let dragging = false;
let lastPoint = null;

const svg = document.getElementById("mainCanvas");
const slider = document.getElementById("zoomSlider");
const resetButton = document.getElementById("resetButton");

Object.keys(names).forEach(id => {

  photos[id] = {
    url: null,
    naturalWidth: 0,
    naturalHeight: 0,
    offsetX: 0,
    offsetY: 0,
    zoom: 1
  };

});


// ======================================
// CREATE MASKS FROM PNG WINDOWS
// ======================================

async function createMask(setting) {

  const source = new Image();
  source.src = setting.file;

  await source.decode();

  const width = 2048;
  const height = 1430;

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(source, 0, 0, width, height);

  const pixels = ctx.getImageData(
    0, 0, width, height
  );

  const data = pixels.data;
  const total = width * height;

  const transparent = new Uint8Array(total);

  for (let i = 0; i < total; i++) {

    const alpha = data[i * 4 + 3];

    if (alpha < 128) {
      transparent[i] = 1;
    }

  }

  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);

  let head = 0;
  let tail = 0;

  const start =
    setting.seedY * width + setting.seedX;

  if (!transparent[start]) {
    throw new Error(
      "Invalid photo window: " + setting.file
    );
  }

  queue[tail++] = start;
  visited[start] = 1;

  while (head < tail) {

    const index = queue[head++];

    const x = index % width;
    const y = Math.floor(index / width);

    const neighbors = [];

    if (x > 0) {
      neighbors.push(index - 1);
    }

    if (x < width - 1) {
      neighbors.push(index + 1);
    }

    if (y > 0) {
      neighbors.push(index - width);
    }

    if (y < height - 1) {
      neighbors.push(index + width);
    }

    for (const next of neighbors) {

      if (visited[next]) continue;
      if (!transparent[next]) continue;

      visited[next] = 1;
      queue[tail++] = next;

    }

  }

  if (tail > total * 0.3) {
    throw new Error(
      "Mask selection is too large: " + setting.file
    );
  }

  const expanded = new Uint8Array(visited);

  for (let i = 0; i < tail; i++) {

    const index = queue[i];

    const x = index % width;
    const y = Math.floor(index / width);

    for (let dy = -2; dy <= 2; dy++) {

      for (let dx = -2; dx <= 2; dx++) {

        const nx = x + dx;
        const ny = y + dy;

        if (
          nx < 0 ||
          nx >= width ||
          ny < 0 ||
          ny >= height
        ) {
          continue;
        }

        expanded[ny * width + nx] = 1;

      }

    }

  }

  const maskData = ctx.createImageData(
    width, height
  );

  for (let i = 0; i < total; i++) {

    const p = i * 4;

    if (expanded[i]) {

      maskData.data[p] = 255;
      maskData.data[p + 1] = 255;
      maskData.data[p + 2] = 255;
      maskData.data[p + 3] = 255;

    } else {

      maskData.data[p] = 0;
      maskData.data[p + 1] = 0;
      maskData.data[p + 2] = 0;
      maskData.data[p + 3] = 255;

    }

  }

  ctx.putImageData(maskData, 0, 0);

  const url = canvas.toDataURL("image/png");

  document
    .getElementById(setting.target)
    .setAttribute("href", url);

}

async function initializeMasks() {

  for (const setting of maskSettings) {

    try {
      await createMask(setting);
    } catch (error) {
      console.error(error);
    }

  }

}

initializeMasks();


// ======================================
// UPLOAD PHOTOS
// ======================================

function setPhoto(event, id) {

  const file = event.target.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);
  const tempImage = new Image();

  tempImage.onload = function() {

    const photo = photos[id];

    if (photo.url) {
      URL.revokeObjectURL(photo.url);
    }

    photo.url = url;
    photo.naturalWidth = tempImage.naturalWidth;
    photo.naturalHeight = tempImage.naturalHeight;

    photo.offsetX = 0;
    photo.offsetY = 0;
    photo.zoom = 1;

    document
      .getElementById(id)
      .setAttribute("href", url);

    updatePhoto(id);
    selectPhoto(id);

    const card = document.getElementById(
      "card-" + id
    );

    card.classList.add("loaded");

    card.querySelector(".status")
      .textContent = "✓ Photo Added";

  };

  tempImage.onerror = function() {

    URL.revokeObjectURL(url);
    alert("Unable to load this image.");

  };

  tempImage.src = url;

}


// ======================================
// UPDATE PHOTO POSITION
// ======================================

function updatePhoto(id) {

  const photo = photos[id];

  if (!photo.url) return;

  const frame = frames[id];
  const image = document.getElementById(id);

  const baseScale = Math.max(
    (frame.w + 8) / photo.naturalWidth,
    (frame.h + 8) / photo.naturalHeight
  );

  const scale = baseScale * photo.zoom;

  const width = photo.naturalWidth * scale;
  const height = photo.naturalHeight * scale;

  const x =
    frame.x +
    (frame.w - width) / 2 +
    photo.offsetX;

  const y =
    frame.y +
    (frame.h - height) / 2 +
    photo.offsetY;

  image.setAttribute("x", x);
  image.setAttribute("y", y);
  image.setAttribute("width", width);
  image.setAttribute("height", height);

}


// ======================================
// SELECT PHOTO
// ======================================

function selectPhoto(id) {

  selectedPhoto = id;

  document
    .querySelectorAll(".photo-hit")
    .forEach(area => {

      area.classList.toggle(
        "selected",
        area.dataset.id === id
      );

    });

  document.getElementById("editingTitle")
    .textContent = "Editing: " + names[id];

  slider.disabled = false;
  resetButton.disabled = false;

  slider.value = photos[id].zoom;

  updateZoomLabel();

}


// ======================================
// ZOOM
// ======================================

function updateZoomLabel() {

  document.getElementById("zoomValue")
    .textContent =
    Math.round(
      Number(slider.value) * 100
    ) + "%";

}

slider.addEventListener("input", function() {

  if (!selectedPhoto) return;

  photos[selectedPhoto].zoom =
    Number(slider.value);

  updatePhoto(selectedPhoto);
  updateZoomLabel();

});


// ======================================
// RESET POSITION
// ======================================

function resetPhoto() {

  if (!selectedPhoto) return;

  const photo = photos[selectedPhoto];

  photo.offsetX = 0;
  photo.offsetY = 0;
  photo.zoom = 1;

  slider.value = 1;

  updatePhoto(selectedPhoto);
  updateZoomLabel();

}


// ======================================
// DRAG PHOTOS
// ======================================

function getPoint(event) {

  const point = svg.createSVGPoint();

  point.x = event.clientX;
  point.y = event.clientY;

  const matrix = svg.getScreenCTM();

  if (!matrix) return null;

  return point.matrixTransform(
    matrix.inverse()
  );

}

svg.addEventListener("pointerdown", function(event) {

  const target = event.target.closest(
    ".photo-hit"
  );

  if (!target) return;

  const id = target.dataset.id;

  if (!photos[id].url) return;

  selectPhoto(id);

  dragging = true;
  lastPoint = getPoint(event);

  svg.setPointerCapture(event.pointerId);

  event.preventDefault();

});

svg.addEventListener("pointermove", function(event) {

  if (
    !dragging ||
    !selectedPhoto ||
    !lastPoint
  ) {
    return;
  }

  const point = getPoint(event);

  if (!point) return;

  const photo = photos[selectedPhoto];
  const frame = frames[selectedPhoto];

  const dx = point.x - lastPoint.x;
  const dy = point.y - lastPoint.y;

  const radians =
    -frame.angle * Math.PI / 180;

  photo.offsetX +=
    dx * Math.cos(radians) -
    dy * Math.sin(radians);

  photo.offsetY +=
    dx * Math.sin(radians) +
    dy * Math.cos(radians);

  lastPoint = point;

  updatePhoto(selectedPhoto);

});

function stopDragging() {

  dragging = false;
  lastPoint = null;

}

svg.addEventListener(
  "pointerup",
  stopDragging
);

svg.addEventListener(
  "pointercancel",
  stopDragging
);

svg.addEventListener(
  "lostpointercapture",
  stopDragging
);

</script>

  <script>
/* ===== BACKGROUND CUSTOMIZER ===== */

(function () {
  const NS = "http://www.w3.org/2000/svg";
  const ID = "backgroundPhoto";

  // Register background as an editable photo
  names[ID] = "Background";

  frames[ID] = {
    x: 0,
    y: 0,
    w: 2048,
    h: 1430,
    angle: 0
  };

  photos[ID] = {

    naturalWidth: 0,
    naturalHeight: 0,
    offsetX: 0,
    offsetY: 0,
    zoom: 1
  };

  // Background image goes behind every frame

  backgroundImage.setAttribute("id", ID);
  backgroundImage.setAttribute("preserveAspectRatio", "none");
  backgroundImage.setAttribute("pointer-events", "none");

  const firstFrame = svg.querySelector("g[mask]");
  svg.insertBefore(backgroundImage, firstFrame);

  // Background drag area
  const backgroundHit = document.createElementNS(NS, "rect");

  backgroundHit.setAttribute("class", "photo-hit");
  backgroundHit.setAttribute("data-id", ID);
  backgroundHit.setAttribute("x", "0");
  backgroundHit.setAttribute("y", "0");
  backgroundHit.setAttribute("width", "2048");
  backgroundHit.setAttribute("height", "1430");
  backgroundHit.style.stroke = "none";

  const hitAreas = document.getElementById("hitAreas");
  hitAreas.insertBefore(backgroundHit, hitAreas.firstChild);

  // Background controls
  const section = document.createElement("div");
  section.style.marginTop = "28px";

  section.innerHTML = `

        style="background:#93bce4;"
      >
        ✧ Edit Background
      </button>

      <button
        type="button"
        class="reset-button"
        id="removeBackgroundButton"
        style="background:#aab8c7;"
      >
        × Remove
      </button>

    </div>
  `;

  document.querySelector(".controls").appendChild(section);

  // Select background for editing
  document
    .getElementById("editBackgroundButton")
    .addEventListener("click", function () {
      if (!photos[ID].url) return;
      selectPhoto(ID);
    });

  // Remove uploaded background
  document
    .getElementById("removeBackgroundButton")
    .addEventListener("click", function () {
      const photo = photos[ID];

      if (!photo.url) return;

      URL.revokeObjectURL(photo.url);

      photo.url = null;
      photo.naturalWidth = 0;
      photo.naturalHeight = 0;
      photo.offsetX = 0;
      photo.offsetY = 0;
      photo.zoom = 1;

      backgroundImage.removeAttribute("href");

      const input = document.getElementById("backgroundInput");
      input.value = "";

      const card = document.getElementById("card-backgroundPhoto");
      card.classList.remove("loaded");

      card.querySelector(".status").textContent =
        "+ Upload Background";

      if (selectedPhoto === ID) {
        selectedPhoto = null;

        document.querySelectorAll(".photo-hit").forEach(area => {
          area.classList.remove("selected");
        });

        document.getElementById("editingTitle").textContent =
          "Select a Photo ♡";

        slider.disabled = true;
        slider.value = 1;

        resetButton.disabled = true;

        updateZoomLabel();
      }

<script>

// ======================================
// BASIC SETTINGS
// ======================================

const names = {
  musicPhoto: "Music Player",
  dayPhoto: "D-Day",
  leftPhoto: "Polaroid 01",
  rightPhoto: "Polaroid 02"
};

const frames = {

  musicPhoto: {
    x: 474,
    y: 300,
    w: 428,
    h: 413,
    angle: 0
  },

  dayPhoto: {
    x: 1281,
    y: 325,
    w: 215,
    h: 210,
    angle: 0
  },

  leftPhoto: {
    x: 958,
    y: 620,
    w: 320.4,
    h: 432.2,
    angle: -7
  },

  rightPhoto: {
    x: 1344,
    y: 638,
    w: 320.2,
    h: 431.2,
    angle: 8.08
  }

};

const maskSettings = [

  {
    file: "images/musicplayer.PNG",
    target: "musicMaskImage",
    seedX: 680,
    seedY: 500
  },

  {
    file: "images/d_day.PNG",
    target: "dayMaskImage",
    seedX: 1385,
    seedY: 430
  },

  {
    file: "images/polaroid_1.PNG",
    target: "leftMaskImage",
    seedX: 1140,
    seedY: 800
  },

  {
    file: "images/polaroid_2.PNG",
    target: "rightMaskImage",
    seedX: 1470,
    seedY: 850
  }

];

const photos = {};

let selectedPhoto = null;
let dragging = false;
let lastPoint = null;

const svg = document.getElementById("mainCanvas");
const slider = document.getElementById("zoomSlider");
const resetButton = document.getElementById("resetButton");

Object.keys(names).forEach(id => {

  photos[id] = {
    url: null,
    naturalWidth: 0,
    naturalHeight: 0,
    offsetX: 0,
    offsetY: 0,
    zoom: 1
  };

});


// ======================================
// CREATE MASKS FROM PNG WINDOWS
// ======================================

async function createMask(setting) {

  const source = new Image();
  source.src = setting.file;

  await source.decode();

  const width = 2048;
  const height = 1430;

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(source, 0, 0, width, height);

  const pixels = ctx.getImageData(
    0, 0, width, height
  );

  const data = pixels.data;
  const total = width * height;

  const transparent = new Uint8Array(total);

  for (let i = 0; i < total; i++) {

    const alpha = data[i * 4 + 3];

    if (alpha < 128) {
      transparent[i] = 1;
    }

  }

  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);

  let head = 0;
  let tail = 0;

  const start =
    setting.seedY * width + setting.seedX;

  if (!transparent[start]) {
    throw new Error(
      "Invalid photo window: " + setting.file
    );
  }

  queue[tail++] = start;
  visited[start] = 1;

  while (head < tail) {

    const index = queue[head++];

    const x = index % width;
    const y = Math.floor(index / width);

    const neighbors = [];

    if (x > 0) {
      neighbors.push(index - 1);
    }

    if (x < width - 1) {
      neighbors.push(index + 1);
    }

    if (y > 0) {
      neighbors.push(index - width);
    }

    if (y < height - 1) {
      neighbors.push(index + width);
    }

    for (const next of neighbors) {

      if (visited[next]) continue;
      if (!transparent[next]) continue;

      visited[next] = 1;
      queue[tail++] = next;

    }

  }

  if (tail > total * 0.3) {
    throw new Error(
      "Mask selection is too large: " + setting.file
    );
  }

  const expanded = new Uint8Array(visited);

  for (let i = 0; i < tail; i++) {

    const index = queue[i];

    const x = index % width;
    const y = Math.floor(index / width);

    for (let dy = -2; dy <= 2; dy++) {

      for (let dx = -2; dx <= 2; dx++) {

        const nx = x + dx;
        const ny = y + dy;

        if (
          nx < 0 ||
          nx >= width ||
          ny < 0 ||
          ny >= height
        ) {
          continue;
        }

        expanded[ny * width + nx] = 1;

      }

    }

  }

  const maskData = ctx.createImageData(
    width, height
  );

  for (let i = 0; i < total; i++) {

    const p = i * 4;

    if (expanded[i]) {

      maskData.data[p] = 255;
      maskData.data[p + 1] = 255;
      maskData.data[p + 2] = 255;
      maskData.data[p + 3] = 255;

    } else {

      maskData.data[p] = 0;
      maskData.data[p + 1] = 0;
      maskData.data[p + 2] = 0;
      maskData.data[p + 3] = 255;

    }

  }

  ctx.putImageData(maskData, 0, 0);

  const url = canvas.toDataURL("image/png");

  document
    .getElementById(setting.target)
    .setAttribute("href", url);

}

async function initializeMasks() {

  for (const setting of maskSettings) {

    try {
      await createMask(setting);
    } catch (error) {
      console.error(error);
    }

  }

}

initializeMasks();


// ======================================
// UPLOAD PHOTOS
// ======================================

function setPhoto(event, id) {

  const file = event.target.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);
  const tempImage = new Image();

  tempImage.onload = function() {

    const photo = photos[id];

    if (photo.url) {
      URL.revokeObjectURL(photo.url);
    }

    photo.url = url;
    photo.naturalWidth = tempImage.naturalWidth;
    photo.naturalHeight = tempImage.naturalHeight;

    photo.offsetX = 0;
    photo.offsetY = 0;
    photo.zoom = 1;

    document
      .getElementById(id)
      .setAttribute("href", url);

    updatePhoto(id);
    selectPhoto(id);

    const card = document.getElementById(
      "card-" + id
    );

    card.classList.add("loaded");

    card.querySelector(".status")
      .textContent = "✓ Photo Added";

  };

  tempImage.onerror = function() {

    URL.revokeObjectURL(url);
    alert("Unable to load this image.");

  };

  tempImage.src = url;

}


// ======================================
// UPDATE PHOTO POSITION
// ======================================

function updatePhoto(id) {

  const photo = photos[id];

  if (!photo.url) return;

  const frame = frames[id];
  const image = document.getElementById(id);

  const baseScale = Math.max(
    (frame.w + 8) / photo.naturalWidth,
    (frame.h + 8) / photo.naturalHeight
  );

  const scale = baseScale * photo.zoom;

  const width = photo.naturalWidth * scale;
  const height = photo.naturalHeight * scale;

  const x =
    frame.x +
    (frame.w - width) / 2 +
    photo.offsetX;

  const y =
    frame.y +
    (frame.h - height) / 2 +
    photo.offsetY;

  image.setAttribute("x", x);
  image.setAttribute("y", y);
  image.setAttribute("width", width);
  image.setAttribute("height", height);

}


// ======================================
// SELECT PHOTO
// ======================================

function selectPhoto(id) {

  selectedPhoto = id;

  document
    .querySelectorAll(".photo-hit")
    .forEach(area => {

      area.classList.toggle(
        "selected",
        area.dataset.id === id
      );

    });

  document.getElementById("editingTitle")
    .textContent = "Editing: " + names[id];

  slider.disabled = false;
  resetButton.disabled = false;

  slider.value = photos[id].zoom;

  updateZoomLabel();

}


// ======================================
// ZOOM
// ======================================

function updateZoomLabel() {

  document.getElementById("zoomValue")
    .textContent =
    Math.round(
      Number(slider.value) * 100
    ) + "%";

}

slider.addEventListener("input", function() {

  if (!selectedPhoto) return;

  photos[selectedPhoto].zoom =
    Number(slider.value);

  updatePhoto(selectedPhoto);
  updateZoomLabel();

});


// ======================================
// RESET POSITION
// ======================================

function resetPhoto() {

  if (!selectedPhoto) return;

  const photo = photos[selectedPhoto];

  photo.offsetX = 0;
  photo.offsetY = 0;
  photo.zoom = 1;

  slider.value = 1;

  updatePhoto(selectedPhoto);
  updateZoomLabel();

}


// ======================================
// DRAG PHOTOS
// ======================================

function getPoint(event) {

  const point = svg.createSVGPoint();

  point.x = event.clientX;
  point.y = event.clientY;

  const matrix = svg.getScreenCTM();

  if (!matrix) return null;

  return point.matrixTransform(
    matrix.inverse()
  );

}

svg.addEventListener("pointerdown", function(event) {

  const target = event.target.closest(
    ".photo-hit"
  );

  if (!target) return;

  const id = target.dataset.id;

  if (!photos[id].url) return;

  selectPhoto(id);

  dragging = true;
  lastPoint = getPoint(event);

  svg.setPointerCapture(event.pointerId);

  event.preventDefault();

});

svg.addEventListener("pointermove", function(event) {

  if (
    !dragging ||
    !selectedPhoto ||
    !lastPoint
  ) {
    return;
  }

  const point = getPoint(event);

  if (!point) return;

  const photo = photos[selectedPhoto];
  const frame = frames[selectedPhoto];

  const dx = point.x - lastPoint.x;
  const dy = point.y - lastPoint.y;

  const radians =
    -frame.angle * Math.PI / 180;

  photo.offsetX +=
    dx * Math.cos(radians) -
    dy * Math.sin(radians);

  photo.offsetY +=
    dx * Math.sin(radians) +
    dy * Math.cos(radians);

  lastPoint = point;

  updatePhoto(selectedPhoto);

});

function stopDragging() {

  dragging = false;
  lastPoint = null;

}

svg.addEventListener(
  "pointerup",
  stopDragging
);

svg.addEventListener(
  "pointercancel",
  stopDragging
);

svg.addEventListener(
  "lostpointercapture",
  stopDragging
);

</script>

/* ===== BACKGROUND CUSTOMIZER ===== */

(function () {

  backgroundHit.style.stroke = "none";

  const hitAreas = document.getElementById("hitAreas");
  hitAreas.insertBefore(backgroundHit, hitAreas.firstChild);

  // Background controls
  const section = document.createElement("div");
  section.style.marginTop = "28px";

  section.innerHTML = `
    <p class="section-title">03 / BACKGROUND</p>

    <label
      class="upload-card"
      id="card-backgroundPhoto"
      style="min-height:100px;"
    >
      <span class="icon">✧</span>
      <span class="name">Background Image</span>
      <span class="status">+ Upload Background</span>

      <input
        id="backgroundInput"
        type="file"
        accept="image/*"
        onchange="setPhoto(event, 'backgroundPhoto')"
      >
    </label>

    <p
      style="
        margin:14px 0;
        text-align:center;
        color:#8191a1;
        font-size:12px;
        line-height:1.8;
      "
    >
      Select the background to adjust its position.<br>
      Drag to move · Use Zoom to resize
    </p>

    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">

      <button
        type="button"
        class="reset-button"
        id="editBackgroundButton"
        style="background:#93bce4;"
      >
        ✧ Edit Background
      </button>

      <button
        type="button"
        class="reset-button"
        id="removeBackgroundButton"
        style="background:#aab8c7;"
      >
        × Remove
      </button>

    </div>
  `;

  document.querySelector(".controls").appendChild(section);

  // Select background for editing
  document
    .getElementById("editBackgroundButton")
    .addEventListener("click", function () {
      if (!photos[ID].url) return;
      selectPhoto(ID);
    });

  // Remove uploaded background
  document
    .getElementById("removeBackgroundButton")
    .addEventListener("click", function () {
      const photo = photos[ID];

      if (!photo.url) return;

      URL.revokeObjectURL(photo.url);

      photo.url = null;
      photo.naturalWidth = 0;
      photo.naturalHeight = 0;
      photo.offsetX = 0;
      photo.offsetY = 0;
      photo.zoom = 1;

      backgroundImage.removeAttribute("href");

      const input = document.getElementById("backgroundInput");
      input.value = "";

      const card = document.getElementById("card-backgroundPhoto");
      card.classList.remove("loaded");

      card.querySelector(".status").textContent =
        "+ Upload Background";

      if (selectedPhoto === ID) {
        selectedPhoto = null;

        document.querySelectorAll(".photo-hit").forEach(area => {
          area.classList.remove("selected");
        });

        document.getElementById("editingTitle").textContent =
          "Select a Photo ♡";

        slider.disabled = true;
        slider.value = 1;

        resetButton.disabled = true;

        updateZoomLabel();
      }
    });

})();
  
</body>
</html>
